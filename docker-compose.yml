# Development defaults are deliberately fake. Production overrides require real values.
x-db: &db
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: taaza
  DB_PASSWORD: ${DB_PASSWORD:-demo-only-database-password}
x-runtime: &runtime
  APP_ENV: ${APP_ENV:-development}
  TZ: Asia/Kolkata
x-service: &service
  restart: unless-stopped
  networks: [taaza-network]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taaza
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo-only-database-password}
      POSTGRES_DB: taaza_main
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U taaza -d taaza_main"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    <<: *service
    image: valkey/valkey:8-alpine
    command: [valkey-server, --appendonly, "yes"]
    volumes: [valkey_data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  user-service:
    <<: *service
    build: ./user-service
    environment:
      <<: [*db, *runtime]
      DB_NAME: taaza_users
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-demo-only-customer-signing-key-32-chars-minimum}
      PORT: "8081"
      EMAIL_SERVICE_URL: http://email-service:8084
    volumes: [uploads:/app/uploads]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  admin-service:
    <<: *service
    build: ./admin-service
    environment:
      <<: [*db, *runtime]
      DB_NAME: taaza_users
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-demo-only-admin-signing-key-32-chars-minimum}
      PORT: "8082"
    depends_on:
      postgres: {condition: service_healthy}
  bootstrap-admin:
    <<: *service
    build: ./admin-service
    profiles: [tools]
    restart: "no"
    command: [./bootstrap-admin]
    environment:
      <<: [*db, *runtime]
      DB_NAME: taaza_users
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Demo-Only-Admin-123!}
    depends_on:
      postgres: {condition: service_healthy}
  inventory-service:
    <<: *service
    build: ./inventory-service
    environment:
      <<: [*db, *runtime]
      DB_NAME: taaza_inventory
      PORT: "8083"
      ADMIN_SERVICE_URL: http://admin-service:8082
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      postgres: {condition: service_healthy}
  email-service:
    <<: *service
    build: ./email-service
    environment:
      <<: *runtime
      REDIS_URL: redis:6379
      PORT: "8084"
      SMTP_MODE: ${SMTP_MODE:-capture}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-taaza@example.test}
      APP_URL: ${APP_URL:-http://localhost:3000}
    depends_on:
      redis: {condition: service_healthy}
  api-gateway:
    <<: *service
    build: ./api-gateway
    environment:
      <<: *runtime
      USER_SERVICE_URL: http://user-service:8081
      ADMIN_SERVICE_URL: http://admin-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-demo-only-customer-signing-key-32-chars-minimum}
      PORT: "8080"
    depends_on:
      redis: {condition: service_healthy}
      user-service: {condition: service_started}
      admin-service: {condition: service_started}
      inventory-service: {condition: service_started}
  user-frontend:
    <<: *service
    build: ./frontend/user-app
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api-gateway]
  admin-frontend:
    <<: *service
    build: ./frontend/admin-app
    ports: ["127.0.0.1:3001:80"]
    depends_on: [api-gateway]
  mailpit:
    <<: *service
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025"]
volumes:
  postgres_data:
  valkey_data:
  uploads:
networks:
  taaza-network:
    driver: bridge
